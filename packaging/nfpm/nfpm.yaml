name: mechanix-music
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Ojas <ojasc@ext.mechasystems.com>"
description: Mechanix Music application
homepage: https://github.com/mecha-org/mechanix-music.git
license: BSD

contents:
  - src: ./stage/bundle/mechanix_music
    dst: /usr/share/mechanix/mechanix-music/mechanix_music
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib
    dst: /usr/share/mechanix/mechanix-music/lib
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-music/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_music
    file_info:
      mode: 0755
  - src: ./org.mechanix.music.desktop
    dst: /usr/share/applications/org.mechanix.music.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.music.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
